<!-- Background Layer -->

<img alt="Luxury apparel silhouettes behind silk curtains" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB4x0gCWek96wvXgQJTO3VTmTJxI8gWqb_OyJFifzpQgHvC1X2k81EGOg-0noHDlpaXWqS5Z884lN9_gxLdQ3z4T_sEIuesBBREvGOiST-qriuDiChZ_Jk6zJ8BGQ6EVVA2BxUDV7SKTcIbVKsB2QCD_AlT_Kh1fsHr8c7b19wAeoBh6il_EtPVrozkwESZVaqdw5i6fkE8dRyuIZzvtuIBE3F8xEOtC8yavtXfpq-fqFhXKSJkhuLCq53DIKkpYbNFvPUPFbIg0V-P"/>

<h1 class="font-display-lg text-display-lg-mobile md:text-display-lg tracking-tighter text-primary">SNITCH</h1>
</header>
<!-- Main Content: Login Card -->
<main class="relative z-10 px-margin-mobile w-full flex justify-center items-center h-full">
<div class="auth-card glass-surface p-8 md:p-12 shadow-2xl animate-fade-in border border-white/50">
<!-- Logo in Card (Editorial refinement) -->
<div class="text-center mb-10">
<span class="font-display-lg text-display-lg-mobile tracking-tighter text-primary">SNITCH</span>
<p class="font-label-caps text-label-caps mt-2 tracking-[0.3em] text-secondary">LUXURY APPAREL</p>
</div>
<!-- Login Form -->
<form class="space-y-6" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="space-y-1">
<label class="font-label-caps text-label-caps text-on-surface-variant block">EMAIL ADDRESS</label>
<input class="w-full bg-transparent border-t-0 border-x-0 border-b border-outline py-4 px-0 focus:ring-0 focus:border-primary transition-colors text-body-md font-body-md placeholder:text-secondary-fixed-dim" placeholder="name@example.com" type="email"/>
</div>
<!-- Password Field -->
<div class="space-y-1">
<label class="font-label-caps text-label-caps text-on-surface-variant block">PASSWORD</label>
<input class="w-full bg-transparent border-t-0 border-x-0 border-b border-outline py-4 px-0 focus:ring-0 focus:border-primary transition-colors text-body-md font-body-md placeholder:text-secondary-fixed-dim" placeholder="••••••••" type="password"/>
</div>
<!-- Remember Me & Forgot Password -->
<div class="flex items-center justify-between font-label-caps text-label-caps pt-2">
<label class="flex items-center cursor-pointer group">
<input class="w-4 h-4 rounded-none border-outline bg-transparent checked:bg-primary focus:ring-0 mr-3 transition-all" type="checkbox"/>
<span class="group-hover:text-primary transition-colors">REMEMBER ME</span>
</label>
<a class="hover:text-primary transition-colors cursor-pointer" href="#">FORGOT PASSWORD?</a>
</div>
<!-- Primary Action -->
<div class="pt-4 space-y-4">
<button class="w-full h-14 bg-primary text-on-primary font-label-caps text-label-caps tracking-[0.2em] hover:opacity-90 active:scale-[0.98] transition-all cursor-pointer" type="submit">
                        LOG IN
                    </button>
<div class="relative py-2 flex items-center justify-center">
<div class="absolute inset-0 flex items-center"><div class="w-full border-t border-outline-variant"></div></div>
<span class="relative px-4 bg-transparent font-label-caps text-[10px] text-secondary">OR CONTINUE WITH</span>
</div>
<button class="w-full h-14 border border-outline bg-transparent text-primary font-label-caps text-label-caps tracking-[0.2em] hover:bg-surface-container-low active:scale-[0.98] transition-all cursor-pointer flex items-center justify-center gap-2" type="button">

</div>

<!-- Atmosphere Micro-interactions -->
<script>
        document.addEventListener('mousemove', (e) => {
            const card = document.querySelector('.auth-card');
            if (card) {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                // Subtle reactive lighting effect based on mouse
                card.style.setProperty('--mouse-x', `${x}px`);
                card.style.setProperty('--mouse-y', `${y}px`);
                
                const moveX = (window.innerWidth / 2 - e.clientX) * 0.01;
                const moveY = (window.innerHeight / 2 - e.clientY) * 0.01;
                
                card.style.transform = `translate(${moveX}px, ${moveY}px)`;
            }
        });
    </script>
